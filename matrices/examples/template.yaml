# Replace every registry.example reference and the GPU UUID before locking.
# The worker images must be separately derived from their matching base manifests.
api_version: upgradeguard.dev/v1alpha1
kind: EnvironmentMatrix
gpu_uuid: GPU-11111111-1111-1111-1111-111111111111
environments:
  - id: baseline
    base_image: registry.example/nvidia/tensorrt:baseline
    worker_image: registry.example/upgrade-guard/worker:baseline
    platform: linux/amd64
  - id: candidate
    base_image: registry.example/nvidia/tensorrt:candidate
    worker_image: registry.example/upgrade-guard/worker:candidate
    platform: linux/amd64
