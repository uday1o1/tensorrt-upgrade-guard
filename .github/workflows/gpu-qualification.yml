name: Trusted GPU qualification

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 6"

permissions:
  contents: read

concurrency:
  group: upgrade-guard-gpu-${{ vars.UPGRADE_GUARD_GPU_UUID }}
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: [self-hosted, linux, x64, gpu, tensorrt-upgradeguard]
    environment: trusted-gpu
    timeout-minutes: 480
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run the complete resumable qualification
        env:
          UG_EXPECTED_GPU_UUID: ${{ vars.UPGRADE_GUARD_GPU_UUID }}
        run: |
          test -n "${UG_EXPECTED_GPU_UUID}"
          bash scripts/run_cuda_pm_qualification.sh
      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gpu-qualification-${{ github.sha }}
          path: .upgrade-guard/cuda-pm
          include-hidden-files: true
          retention-days: 14
