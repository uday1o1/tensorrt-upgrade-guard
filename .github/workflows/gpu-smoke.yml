name: Trusted GPU smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - ".github/workflows/gpu-smoke.yml"
      - "cmake/**"
      - "containers/**"
      - "corpus/**"
      - "cpp/**"
      - "matrices/**"
      - "models/**"
      - "qualification/**"
      - "scripts/**"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

concurrency:
  group: upgrade-guard-gpu-${{ vars.UPGRADE_GUARD_GPU_UUID }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: [self-hosted, linux, x64, gpu, tensorrt-upgradeguard]
    environment: trusted-gpu
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run bounded smoke qualification
        env:
          UG_EXPECTED_GPU_UUID: ${{ vars.UPGRADE_GUARD_GPU_UUID }}
          UG_SMOKE_ONLY: "1"
        run: |
          test -n "${UG_EXPECTED_GPU_UUID}"
          bash scripts/run_cuda_pm_qualification.sh
