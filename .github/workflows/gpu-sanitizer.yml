name: Trusted GPU sanitizer

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upgrade-guard-gpu-${{ vars.UPGRADE_GUARD_GPU_UUID }}
  cancel-in-progress: false

jobs:
  sanitizer:
    runs-on: [self-hosted, linux, x64, gpu, tensorrt-upgradeguard]
    environment: trusted-gpu
    timeout-minutes: 240
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run through focused sanitizer gates
        env:
          UG_EXPECTED_GPU_UUID: ${{ vars.UPGRADE_GUARD_GPU_UUID }}
          UG_THROUGH_STEP: sanitizers
        run: |
          test -n "${UG_EXPECTED_GPU_UUID}"
          bash scripts/run_cuda_pm_qualification.sh
      - name: Retain sanitizer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gpu-sanitizer-${{ github.sha }}
          path: .upgrade-guard/cuda-pm
          include-hidden-files: true
          retention-days: 14
